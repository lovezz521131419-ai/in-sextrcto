services:
  - type: web
    name: ai-visual-instagram-extractor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RATE_LIMIT_PER_MINUTE
        value: 8
      - key: ALLOWED_ORIGINS
        value: https://tekisss.netlify.app
